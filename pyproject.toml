[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaogu"
version = "0.1.0"
description = "A small personal quantitative trading toolkit with backtesting and paper execution."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
chaogu = "chaogu.cli:main"

[tool.setuptools]
packages = ["chaogu"]
