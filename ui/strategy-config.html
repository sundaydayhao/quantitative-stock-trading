<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>chaogu 控制台</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --soft: #eef3f7;
      --line: #d7dee6;
      --text: #17202a;
      --muted: #667487;
      --accent: #0f766e;
      --accent-dark: #0a5c56;
      --blue: #285fbb;
      --red: #a83232;
      --amber: #8a6100;
      --shadow: 0 14px 32px rgb(23 32 42 / 8%);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .shell {
      display: grid;
      grid-template-columns: 310px minmax(0, 1fr);
      min-height: 100vh;
    }

    .side {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 16px;
      padding: 20px;
      border-right: 1px solid var(--line);
      background: var(--panel);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 780;
    }

    .tag {
      flex: 0 0 auto;
      padding: 5px 9px;
      border-radius: 7px;
      background: var(--accent);
      color: #ffffff;
      font-size: 12px;
      font-weight: 760;
    }

    .mode {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 4px;
      border-radius: 8px;
      background: var(--soft);
    }

    .mode button {
      min-height: 40px;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-weight: 760;
    }

    .mode button.active {
      background: var(--panel);
      color: var(--accent-dark);
      box-shadow: 0 6px 16px rgb(23 32 42 / 8%);
    }

    .list {
      display: grid;
      align-content: start;
      gap: 10px;
      min-height: 0;
      overflow: auto;
    }

    .config-item {
      width: 100%;
      min-height: 66px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      text-align: left;
    }

    .config-item.active,
    .config-item:hover {
      border-color: var(--accent);
      box-shadow: 0 8px 18px rgb(15 118 110 / 12%);
    }

    .config-item strong,
    .job-row strong {
      display: block;
      overflow-wrap: anywhere;
      font-size: 13px;
      line-height: 1.3;
    }

    .config-item span,
    .job-row span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .side-actions {
      display: grid;
      gap: 10px;
    }

    .main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 17px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
    }

    .topbar h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
    }

    .status {
      min-height: 22px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      text-align: right;
    }

    .status.ok {
      color: var(--accent-dark);
      font-weight: 740;
    }

    .status.error {
      color: var(--red);
      font-weight: 740;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 480px);
      gap: 18px;
      min-height: 0;
      padding: 18px;
      overflow: auto;
    }

    .stack {
      display: grid;
      align-content: start;
      gap: 18px;
      min-width: 0;
    }

    .panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 15px;
      border-bottom: 1px solid var(--line);
    }

    .panel-header h3 {
      margin: 0;
      font-size: 15px;
      line-height: 1.3;
    }

    .panel-body {
      padding: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      color: var(--text);
      outline: none;
    }

    input,
    select {
      min-height: 40px;
      padding: 0 11px;
    }

    textarea {
      min-height: 500px;
      padding: 12px;
      resize: vertical;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgb(15 118 110 / 12%);
    }

    .strategy-fields,
    .mode-panel {
      display: none;
    }

    .strategy-fields.active {
      display: contents;
    }

    .mode-panel.active {
      display: block;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      min-height: 38px;
      padding: 0 14px;
      border-radius: 8px;
      background: var(--soft);
      color: var(--text);
      font-weight: 760;
      white-space: nowrap;
    }

    .btn.primary {
      background: var(--accent);
      color: #ffffff;
    }

    .btn.primary:hover {
      background: var(--accent-dark);
    }

    .btn.danger {
      background: #fdecec;
      color: var(--red);
    }

    .btn.outline {
      border: 1px solid var(--line);
      background: #ffffff;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      min-height: 70px;
      padding: 11px;
      border-radius: 8px;
      background: var(--soft);
    }

    .metric b {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .metric span {
      display: block;
      overflow-wrap: anywhere;
      font-size: 15px;
      font-weight: 780;
      line-height: 1.25;
    }

    .job-list {
      display: grid;
      gap: 9px;
      max-height: 260px;
      overflow: auto;
    }

    .job-row {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      color: var(--text);
      text-align: left;
    }

    .job-row.active,
    .job-row:hover {
      border-color: var(--blue);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
    }

    .pill.running {
      background: #eaf3ff;
      color: var(--blue);
    }

    .pill.completed {
      background: #e8f7f3;
      color: var(--accent-dark);
    }

    .pill.failed {
      background: #fdecec;
      color: var(--red);
    }

    .result {
      min-height: 150px;
      padding: 12px;
      border-radius: 8px;
      background: #101820;
      color: #dce9f2;
      overflow: auto;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .result-detail {
      display: grid;
      gap: 14px;
      margin-bottom: 12px;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .result-card {
      min-height: 66px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
    }

    .result-card b {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .result-card span {
      display: block;
      overflow-wrap: anywhere;
      font-size: 15px;
      font-weight: 780;
      line-height: 1.25;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .chart {
      width: 100%;
      min-height: 220px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
    }

    .chart svg {
      display: block;
      width: 100%;
      height: 220px;
    }

    .chart-empty {
      display: grid;
      min-height: 160px;
      place-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .swatch {
      width: 22px;
      height: 3px;
      border-radius: 999px;
      background: var(--accent);
    }

    .swatch.blue {
      background: var(--blue);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th,
    td {
      padding: 8px 9px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: var(--soft);
      color: var(--muted);
      font-weight: 780;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    details summary {
      margin-bottom: 8px;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 760;
    }

    .notice {
      padding: 11px;
      border-left: 3px solid var(--amber);
      border-radius: 6px;
      background: #fff8e7;
      color: #5b4100;
      font-size: 12px;
      line-height: 1.45;
    }

    @media (max-width: 1060px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .side {
        grid-template-rows: auto auto auto auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .workspace {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 680px) {
      .topbar,
      .brand {
        align-items: stretch;
        flex-direction: column;
      }

      .status {
        text-align: left;
      }

      .workspace,
      .side {
        padding: 14px;
      }

      .list,
      .grid,
      .metrics,
      .result-grid {
        grid-template-columns: 1fr;
      }

      .actions {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <h1>chaogu 控制台</h1>
        <span class="tag">A 股</span>
      </div>
      <div class="mode" role="tablist">
        <button id="historyModeBtn" class="active" type="button">历史验证</button>
        <button id="liveModeBtn" type="button">实盘操作</button>
      </div>
      <div class="list" id="configList"></div>
      <div class="side-actions">
        <button class="btn outline" id="reloadBtn" type="button">刷新</button>
        <button class="btn outline" id="saveBtn" type="button">保存配置</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h2 id="pageTitle">历史数据策略验证</h2>
        <div class="status" id="statusText">连接后台中</div>
      </header>

      <section class="workspace">
        <div class="stack">
          <section class="panel">
            <div class="panel-header">
              <h3>基础配置</h3>
              <span class="pill" id="activeConfigName">未保存</span>
            </div>
            <div class="panel-body">
              <div class="grid">
                <div class="field">
                  <label for="configName">配置文件</label>
                  <input id="configName" type="text" value="web_strategy.json">
                </div>
                <div class="field">
                  <label for="symbol">标的代码</label>
                  <input id="symbol" data-path="symbol" type="text">
                </div>
                <div class="field">
                  <label for="startingCash">初始资金</label>
                  <input id="startingCash" data-path="starting_cash" type="number" min="1" step="1000">
                </div>
                <div class="field">
                  <label for="strategyName">策略</label>
                  <select id="strategyName" data-path="strategy.name">
                    <option value="moving_average_cross">均线趋势</option>
                    <option value="breakout">区间突破</option>
                    <option value="rsi_mean_reversion">RSI 均值回归</option>
                    <option value="momentum">动量过滤</option>
                  </select>
                </div>
                <div class="field full">
                  <label for="marketDataCsv">行情 CSV</label>
                  <input id="marketDataCsv" data-path="market_data_csv" type="text">
                </div>
              </div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <h3>策略参数</h3>
            </div>
            <div class="panel-body">
              <div class="grid">
                <div class="field">
                  <label for="targetWeight">目标仓位</label>
                  <input id="targetWeight" data-path="strategy.target_weight" type="number" min="0" max="1" step="0.01">
                </div>
                <div class="strategy-fields active" data-strategy="moving_average_cross">
                  <div class="field">
                    <label for="shortWindow">短均线窗口</label>
                    <input id="shortWindow" data-path="strategy.short_window" type="number" min="1" step="1">
                  </div>
                  <div class="field">
                    <label for="longWindow">长均线窗口</label>
                    <input id="longWindow" data-path="strategy.long_window" type="number" min="2" step="1">
                  </div>
                </div>
                <div class="strategy-fields" data-strategy="breakout">
                  <div class="field">
                    <label for="entryWindow">突破窗口</label>
                    <input id="entryWindow" data-path="strategy.entry_window" type="number" min="2" step="1">
                  </div>
                  <div class="field">
                    <label for="exitWindow">退出窗口</label>
                    <input id="exitWindow" data-path="strategy.exit_window" type="number" min="2" step="1">
                  </div>
                </div>
                <div class="strategy-fields" data-strategy="rsi_mean_reversion">
                  <div class="field">
                    <label for="rsiWindow">RSI 窗口</label>
                    <input id="rsiWindow" data-path="strategy.rsi_window" type="number" min="2" step="1">
                  </div>
                  <div class="field">
                    <label for="buyBelow">买入阈值</label>
                    <input id="buyBelow" data-path="strategy.buy_below" type="number" min="1" max="99" step="0.5">
                  </div>
                  <div class="field">
                    <label for="sellAbove">卖出阈值</label>
                    <input id="sellAbove" data-path="strategy.sell_above" type="number" min="1" max="99" step="0.5">
                  </div>
                </div>
                <div class="strategy-fields" data-strategy="momentum">
                  <div class="field">
                    <label for="lookbackWindow">回看窗口</label>
                    <input id="lookbackWindow" data-path="strategy.lookback_window" type="number" min="2" step="1">
                  </div>
                  <div class="field">
                    <label for="entryReturnPct">入场收益率</label>
                    <input id="entryReturnPct" data-path="strategy.entry_return_pct" type="number" step="0.01">
                  </div>
                  <div class="field">
                    <label for="exitReturnPct">退出收益率</label>
                    <input id="exitReturnPct" data-path="strategy.exit_return_pct" type="number" step="0.01">
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section class="panel mode-panel active" data-mode="history">
            <div class="panel-header">
              <h3>历史数据</h3>
              <span class="pill">下载 / 回测</span>
            </div>
            <div class="panel-body">
              <div class="grid">
                <div class="field">
                  <label for="provider">数据源</label>
                  <select id="provider">
                    <option value="akshare">AkShare</option>
                    <option value="xtquant">xtquant</option>
                  </select>
                </div>
                <div class="field">
                  <label for="adjust">复权</label>
                  <select id="adjust">
                    <option value="qfq">前复权</option>
                    <option value="none">不复权</option>
                    <option value="hfq">后复权</option>
                  </select>
                </div>
                <div class="field">
                  <label for="startDate">开始日期</label>
                  <input id="startDate" type="date" value="2020-01-01">
                </div>
                <div class="field">
                  <label for="endDate">结束日期</label>
                  <input id="endDate" type="date" value="2025-12-31">
                </div>
                <div class="field full">
                  <label for="downloadOut">输出 CSV</label>
                  <input id="downloadOut" type="text" value="data/000001.SZ.daily.qfq.csv">
                </div>
                <div class="field full">
                  <div class="actions">
                    <button class="btn outline" id="downloadBtn" type="button">下载历史数据</button>
                    <button class="btn primary" id="backtestBtn" type="button">运行策略验证</button>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section class="panel mode-panel active" data-mode="history">
            <div class="panel-header">
              <h3>Python 选股</h3>
              <span class="pill">本地 CSV</span>
            </div>
            <div class="panel-body">
              <div class="grid">
                <div class="field full">
                  <label for="screenPattern">扫描文件</label>
                  <input id="screenPattern" type="text" value="data/*.csv">
                </div>
                <div class="field">
                  <label for="screenLookback">收益回看</label>
                  <input id="screenLookback" type="number" min="2" step="1" value="20">
                </div>
                <div class="field">
                  <label for="screenLimit">最多结果</label>
                  <input id="screenLimit" type="number" min="1" step="1" value="50">
                </div>
                <div class="field">
                  <label for="screenShortWindow">短均线</label>
                  <input id="screenShortWindow" type="number" min="1" step="1" value="5">
                </div>
                <div class="field">
                  <label for="screenLongWindow">长均线</label>
                  <input id="screenLongWindow" type="number" min="2" step="1" value="20">
                </div>
                <div class="field">
                  <label for="screenMinReturn">最低收益率</label>
                  <input id="screenMinReturn" type="number" step="0.01" value="0">
                </div>
                <div class="field">
                  <label for="screenMinVolume">最低均量</label>
                  <input id="screenMinVolume" type="number" min="0" step="1000" value="0">
                </div>
                <div class="field">
                  <label for="screenRequireUptrend">趋势过滤</label>
                  <select id="screenRequireUptrend">
                    <option value="true">要求短均线高于长均线</option>
                    <option value="false">不要求</option>
                  </select>
                </div>
                <div class="field full">
                  <div class="actions">
                    <button class="btn primary" id="screenBtn" type="button">运行选股</button>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section class="panel mode-panel" data-mode="live">
            <div class="panel-header">
              <h3>实盘控制</h3>
              <span class="pill">后台轮询</span>
            </div>
            <div class="panel-body">
              <div class="grid">
                <div class="field">
                  <label for="broker">交易通道</label>
                  <select id="broker" data-path="execution.broker">
                    <option value="paper">模拟实盘</option>
                    <option value="live">真实券商</option>
                  </select>
                </div>
                <div class="field">
                  <label for="pollSeconds">轮询秒数</label>
                  <input id="pollSeconds" data-path="execution.poll_seconds" type="number" min="1" step="1">
                </div>
                <div class="field full">
                  <label for="statePath">状态文件</label>
                  <input id="statePath" type="text" value="runs/web/live/web_strategy.state.json">
                </div>
                <div class="field full">
                  <div class="notice">真实券商下单需要先实现后台券商适配器；当前默认使用模拟实盘通道。</div>
                </div>
                <div class="field full">
                  <div class="actions">
                    <button class="btn primary" id="liveStartBtn" type="button">启动实盘任务</button>
                    <button class="btn danger" id="liveStopBtn" type="button">停止任务</button>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <h3>风控与费用</h3>
            </div>
            <div class="panel-body">
              <div class="grid">
                <div class="field">
                  <label for="maxPositionPct">单标的上限</label>
                  <input id="maxPositionPct" data-path="risk.max_position_pct" type="number" min="0.01" max="1" step="0.01">
                </div>
                <div class="field">
                  <label for="maxOrderValue">单笔上限</label>
                  <input id="maxOrderValue" data-path="risk.max_order_value" type="number" min="1" step="1000">
                </div>
                <div class="field">
                  <label for="cashBuffer">现金缓冲</label>
                  <input id="cashBuffer" data-path="risk.min_cash_buffer_pct" type="number" min="0" max="0.99" step="0.01">
                </div>
                <div class="field">
                  <label for="maxDailyLoss">日内亏损阈值</label>
                  <input id="maxDailyLoss" data-path="risk.max_daily_loss_pct" type="number" min="0.001" max="1" step="0.001">
                </div>
                <div class="field">
                  <label for="stopLoss">止损</label>
                  <input id="stopLoss" data-path="risk.stop_loss_pct" type="number" min="0" max="0.99" step="0.01">
                </div>
                <div class="field">
                  <label for="takeProfit">止盈</label>
                  <input id="takeProfit" data-path="risk.take_profit_pct" type="number" min="0" step="0.01">
                </div>
                <div class="field">
                  <label for="minOrderValue">最小下单金额</label>
                  <input id="minOrderValue" data-path="risk.min_order_value" type="number" min="0" step="100">
                </div>
                <div class="field">
                  <label for="lotSize">交易单位</label>
                  <input id="lotSize" data-path="risk.lot_size" type="number" min="1" step="1">
                </div>
                <div class="field">
                  <label for="commissionBps">佣金 bps</label>
                  <input id="commissionBps" data-path="execution.commission_bps" type="number" min="0" step="0.1">
                </div>
                <div class="field">
                  <label for="slippageBps">滑点 bps</label>
                  <input id="slippageBps" data-path="execution.slippage_bps" type="number" min="0" step="0.1">
                </div>
                <div class="field">
                  <label for="minFee">最低费用</label>
                  <input id="minFee" data-path="execution.min_fee" type="number" min="0" step="0.1">
                </div>
              </div>
            </div>
          </section>
        </div>

        <aside class="stack">
          <section class="panel">
            <div class="panel-header">
              <h3>运行状态</h3>
              <button class="btn outline" id="refreshJobsBtn" type="button">刷新任务</button>
            </div>
            <div class="panel-body">
              <div class="metrics">
                <div class="metric">
                  <b>模式</b>
                  <span id="summaryMode">历史验证</span>
                </div>
                <div class="metric">
                  <b>策略</b>
                  <span id="summaryStrategy">均线趋势</span>
                </div>
                <div class="metric">
                  <b>仓位</b>
                  <span id="summaryWeight">60%</span>
                </div>
              </div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <h3>任务</h3>
              <span class="pill" id="jobCount">0</span>
            </div>
            <div class="panel-body">
              <div class="job-list" id="jobList"></div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <h3>结果</h3>
            </div>
            <div class="panel-body">
              <div class="result-detail" id="resultDetail"></div>
              <details>
                <summary>原始 JSON</summary>
                <div class="result" id="resultBox">{}</div>
              </details>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <h3>JSON</h3>
              <span class="pill" id="jsonState">已同步</span>
            </div>
            <div class="panel-body">
              <textarea id="jsonOutput" spellcheck="false"></textarea>
            </div>
          </section>
        </aside>
      </section>
    </main>
  </div>

  <script>
    const strategyLabels = {
      moving_average_cross: "均线趋势",
      breakout: "区间突破",
      rsi_mean_reversion: "RSI 均值回归",
      momentum: "动量过滤"
    };

    const defaultConfig = {
      symbol: "SAMPLE",
      market_data_csv: "data/sample_prices.csv",
      starting_cash: 100000.0,
      strategy: {
        name: "moving_average_cross",
        short_window: 5,
        long_window: 20,
        target_weight: 0.6
      },
      risk: {
        max_position_pct: 0.65,
        max_order_value: 25000.0,
        min_cash_buffer_pct: 0.05,
        max_daily_loss_pct: 0.03,
        stop_loss_pct: 0.08,
        take_profit_pct: 0.18,
        min_order_value: 1000.0,
        allow_short: false,
        lot_size: 100
      },
      execution: {
        broker: "paper",
        commission_bps: 2.0,
        slippage_bps: 3.0,
        min_fee: 5.0,
        poll_seconds: 60
      }
    };

    const fields = Array.from(document.querySelectorAll("[data-path]"));
    const state = {
      mode: "history",
      configs: [],
      jobs: [],
      activeConfigPath: "",
      selectedJobId: "",
      config: clone(defaultConfig)
    };

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function $(id) {
      return document.getElementById(id);
    }

    function getByPath(object, path) {
      return path.split(".").reduce((target, key) => target && target[key], object);
    }

    function setByPath(object, path, value) {
      const parts = path.split(".");
      const last = parts.pop();
      const target = parts.reduce((current, key) => {
        if (!current[key]) current[key] = {};
        return current[key];
      }, object);
      target[last] = value;
    }

    function numberValue(input) {
      if (input.value.trim() === "") return null;
      return Number(input.value);
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });
      const payload = await response.json();
      if (!response.ok) {
        throw new Error(payload.error || response.statusText);
      }
      return payload;
    }

    function setStatus(message, kind = "") {
      $("statusText").textContent = message;
      $("statusText").className = `status ${kind}`.trim();
    }

    function readForm() {
      const next = {
        symbol: "",
        market_data_csv: "",
        starting_cash: 0,
        strategy: {},
        risk: { allow_short: false },
        execution: {}
      };

      for (const field of fields) {
        const group = field.closest(".strategy-fields");
        if (group && !group.classList.contains("active")) continue;
        const value = field.type === "number" ? numberValue(field) : field.value;
        setByPath(next, field.dataset.path, value);
      }
      return compactStrategy(next);
    }

    function compactStrategy(config) {
      const name = config.strategy.name;
      const allowed = {
        moving_average_cross: ["name", "target_weight", "short_window", "long_window"],
        breakout: ["name", "target_weight", "entry_window", "exit_window"],
        rsi_mean_reversion: ["name", "target_weight", "rsi_window", "buy_below", "sell_above"],
        momentum: ["name", "target_weight", "lookback_window", "entry_return_pct", "exit_return_pct"]
      }[name] || [];
      config.strategy = Object.fromEntries(
        Object.entries(config.strategy).filter(([key, value]) => allowed.includes(key) && value !== null && value !== "")
      );
      return config;
    }

    function writeForm(config) {
      state.config = clone(config);
      for (const field of fields) {
        const value = getByPath(state.config, field.dataset.path);
        field.value = value === undefined || value === null ? "" : value;
      }
      updateStrategyFields();
      syncJson();
    }

    function updateStrategyFields() {
      const strategy = $("strategyName").value;
      document.querySelectorAll(".strategy-fields").forEach((group) => {
        group.classList.toggle("active", group.dataset.strategy === strategy);
      });
    }

    function syncJson() {
      state.config = readForm();
      $("jsonOutput").value = JSON.stringify(state.config, null, 2);
      $("jsonState").textContent = "已同步";
      $("summaryMode").textContent = state.mode === "history" ? "历史验证" : "实盘操作";
      $("summaryStrategy").textContent = strategyLabels[state.config.strategy.name] || state.config.strategy.name;
      $("summaryWeight").textContent = `${Math.round((state.config.strategy.target_weight || 0) * 100)}%`;
      updateDerivedPaths();
    }

    function updateDerivedPaths() {
      const symbol = $("symbol").value || "SAMPLE";
      const adjust = $("adjust").value || "qfq";
      if (!$("downloadOut").dataset.touched) {
        $("downloadOut").value = `data/${symbol}.daily.${adjust}.csv`;
      }
      if (!$("statePath").dataset.touched) {
        $("statePath").value = `runs/web/live/${configBaseName()}.state.json`;
      }
    }

    function configFileName() {
      const raw = $("configName").value.trim() || `${configBaseName()}.json`;
      return raw.endsWith(".json") ? raw : `${raw}.json`;
    }

    function configBaseName() {
      const symbol = ($("symbol").value || "strategy").replaceAll(".", "_");
      const strategy = $("strategyName").value || "strategy";
      return `${symbol}_${strategy}`;
    }

    function setMode(mode) {
      state.mode = mode;
      $("historyModeBtn").classList.toggle("active", mode === "history");
      $("liveModeBtn").classList.toggle("active", mode === "live");
      document.querySelectorAll(".mode-panel").forEach((panel) => {
        panel.classList.toggle("active", panel.dataset.mode === mode);
      });
      $("pageTitle").textContent = mode === "history" ? "历史数据策略验证" : "实盘操作";
      syncJson();
    }

    async function refreshConfigs() {
      const payload = await api("/api/configs");
      state.configs = payload.configs || [];
      renderConfigs();
      if (!state.activeConfigPath && state.configs.length) {
        selectConfig(state.configs[0]);
      }
    }

    function renderConfigs() {
      $("configList").innerHTML = "";
      for (const item of state.configs) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `config-item${item.path === state.activeConfigPath ? " active" : ""}`;
        const strategy = item.config && item.config.strategy ? item.config.strategy.name : "";
        button.innerHTML = `<strong>${item.name}</strong><span>${item.error || strategyLabels[strategy] || strategy || item.path}</span>`;
        button.addEventListener("click", () => selectConfig(item));
        $("configList").appendChild(button);
      }
    }

    function selectConfig(item) {
      if (!item.config) {
        setStatus(item.error || "配置不可用", "error");
        return;
      }
      state.activeConfigPath = item.path;
      $("configName").value = item.name === "config.example.json" ? "web_strategy.json" : item.name;
      $("activeConfigName").textContent = item.name;
      writeForm(item.config);
      renderConfigs();
      setStatus("配置已载入", "ok");
    }

    async function saveConfig() {
      syncJson();
      const payload = await api("/api/configs/save", {
        method: "POST",
        body: JSON.stringify({ name: configFileName(), config: state.config })
      });
      $("activeConfigName").textContent = payload.path;
      setStatus("配置已保存", "ok");
      await refreshConfigs();
      return payload;
    }

    async function runDownload() {
      syncJson();
      const payload = {
        provider: $("provider").value,
        symbol: $("symbol").value,
        start: $("startDate").value,
        end: $("endDate").value,
        adjust: $("adjust").value,
        out: $("downloadOut").value,
        period: "daily"
      };
      const result = await api("/api/download", { method: "POST", body: JSON.stringify(payload) });
      setStatus("历史数据下载已启动", "ok");
      state.selectedJobId = result.job.id;
      await refreshJobs();
    }

    async function runBacktest() {
      syncJson();
      const result = await api("/api/backtest", {
        method: "POST",
        body: JSON.stringify({ name: configFileName(), config: state.config })
      });
      setStatus("策略验证已启动", "ok");
      state.selectedJobId = result.job.id;
      await refreshJobs();
    }

    async function runScreen() {
      const payload = {
        pattern: $("screenPattern").value,
        lookback: Number($("screenLookback").value),
        short_window: Number($("screenShortWindow").value),
        long_window: Number($("screenLongWindow").value),
        min_return_pct: Number($("screenMinReturn").value),
        min_avg_volume: Number($("screenMinVolume").value),
        require_uptrend: $("screenRequireUptrend").value === "true",
        limit: Number($("screenLimit").value)
      };
      const result = await api("/api/screen", { method: "POST", body: JSON.stringify(payload) });
      setStatus("选股任务已启动", "ok");
      state.selectedJobId = result.job.id;
      await refreshJobs();
    }

    async function startLive() {
      syncJson();
      const result = await api("/api/live/start", {
        method: "POST",
        body: JSON.stringify({
          name: configFileName(),
          config: state.config,
          state_path: $("statePath").value
        })
      });
      setStatus("实盘任务已启动", "ok");
      state.selectedJobId = result.job.id;
      await refreshJobs();
    }

    async function stopLive() {
      const jobId = state.selectedJobId || firstRunningLiveJobId();
      if (!jobId) {
        setStatus("没有运行中的实盘任务", "error");
        return;
      }
      await api(`/api/jobs/${jobId}/stop`, { method: "POST", body: "{}" });
      setStatus("停止请求已发送", "ok");
      await refreshJobs();
    }

    function firstRunningLiveJobId() {
      const job = state.jobs.find((item) => item.kind === "live" && item.status === "running");
      return job ? job.id : "";
    }

    async function refreshJobs() {
      const payload = await api("/api/jobs");
      state.jobs = payload.jobs || [];
      $("jobCount").textContent = String(state.jobs.length);
      renderJobs();
      const selected = state.jobs.find((job) => job.id === state.selectedJobId) || state.jobs[0];
      renderResult(selected);
    }

    function renderJobs() {
      $("jobList").innerHTML = "";
      if (!state.jobs.length) {
        $("jobList").innerHTML = "<span class=\"pill\">暂无任务</span>";
        return;
      }
      for (const job of state.jobs) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `job-row${job.id === state.selectedJobId ? " active" : ""}`;
        button.innerHTML = `<strong>${job.kind} · ${job.id}</strong><span><span class="pill ${job.status}">${job.status}</span> ${job.started_at || job.created_at}</span>`;
        button.addEventListener("click", () => {
          state.selectedJobId = job.id;
          renderJobs();
          renderResult(job);
        });
        $("jobList").appendChild(button);
      }
    }

    function renderResult(job) {
      if (!job) {
        $("resultBox").textContent = "{}";
        $("resultDetail").innerHTML = "<div class=\"notice\">暂无任务结果。</div>";
        return;
      }
      const payload = {
        id: job.id,
        kind: job.kind,
        status: job.status,
        error: job.error,
        result: job.result,
        logs: job.logs
      };
      renderResultDetail(job);
      $("resultBox").textContent = JSON.stringify(payload, null, 2);
    }

    function renderResultDetail(job) {
      if (job.error) {
        $("resultDetail").innerHTML = `<div class="notice">${escapeHtml(job.error)}</div>`;
        return;
      }
      if (!job.result) {
        $("resultDetail").innerHTML = `<div class="notice">${escapeHtml(job.kind)} 任务状态：${escapeHtml(job.status)}</div>`;
        return;
      }
      if (job.kind === "backtest") {
        renderBacktestDetail(job.result);
        return;
      }
      if (job.kind === "live") {
        renderLiveDetail(job.result);
        return;
      }
      if (job.kind === "download") {
        renderDownloadDetail(job.result);
        return;
      }
      if (job.kind === "screen") {
        renderScreenDetail(job.result);
        return;
      }
      $("resultDetail").innerHTML = `<div class="notice">${escapeHtml(job.kind)} 任务完成。</div>`;
    }

    function renderBacktestDetail(result) {
      const summary = result.summary || {};
      const equityCurve = result.equity_curve || result.equity_tail || [];
      const fills = result.fills || [];
      const cashLedger = result.cash_ledger || [];
      const cards = resultCards([
        ["标的", summary.symbol || "-"],
        ["总收益", `${fmt(summary.total_return_pct)}%`],
        ["最大回撤", `${fmt(summary.max_drawdown_pct)}%`],
        ["期末权益", fmt(summary.final_equity)],
        ["成交数", fills.length || summary.fills || 0],
        ["卖出胜率", `${fmt(summary.sell_win_rate_pct)}%`]
      ]);
      const chart = lineChart(
        equityCurve,
        [
          { key: "equity", label: "权益", color: "#0f766e" },
          { key: "cash", label: "现金", color: "#285fbb" }
        ],
        "timestamp"
      );
      const links = [
        result.summary_url ? `<a href="${escapeAttr(result.summary_url)}" target="_blank">summary.json</a>` : "",
        result.equity_curve_url ? `<a href="${escapeAttr(result.equity_curve_url)}" target="_blank">equity_curve.csv</a>` : "",
        result.fills_url ? `<a href="${escapeAttr(result.fills_url)}" target="_blank">fills.csv</a>` : ""
      ].filter(Boolean).join(" · ");
      const fillsTable = table(
        ["时间", "标的", "方向", "数量", "价格", "费用", "滑点", "原因", "已实现盈亏"],
        fills,
        (row) => [row.timestamp, row.symbol, row.side, row.quantity, fmt(row.price), fmt(row.fee), fmt(row.slippage), row.reason, fmt(row.realized_pnl)]
      );
      const ledger = table(
        ["时间", "标的", "方向", "成交额", "手续费", "现金变化", "累计现金影响", "已实现盈亏"],
        cashLedger,
        (row) => [row.timestamp, row.symbol, row.side, fmt(row.gross_amount), fmt(row.fee), fmt(row.cash_effect), fmt(row.cumulative_cash_effect), fmt(row.realized_pnl)]
      );
      const equity = table(
        ["时间", "收盘", "现金", "持仓数量", "持仓成本", "权益"],
        equityCurve,
        (row) => [row.timestamp, fmt(row.close), fmt(row.cash), row.position_qty, fmt(row.position_avg_price), fmt(row.equity)]
      );
      $("resultDetail").innerHTML = `${cards}<h4>资金曲线</h4>${chart}<div class="notice">输出文件：${links || "无"}</div><h4>全部成交记录</h4>${fillsTable}<h4>全部资金流水</h4>${ledger}<h4>全部资金曲线数据</h4>${equity}`;
    }

    function renderLiveDetail(result) {
      const report = result.last_report || {};
      const reports = result.reports || [];
      const fills = report.fills || [];
      const cashLedger = report.cash_ledger || [];
      const positions = Object.values(report.positions || {});
      const cards = resultCards([
        ["轮询次数", result.cycles ?? 0],
        ["现金", fmt(report.cash)],
        ["权益", fmt(report.equity)],
        ["已处理K线", report.processed_bars ?? 0],
        ["新增K线", report.new_bars ?? 0],
        ["累计成交", fills.length]
      ]);
      const chart = lineChart(
        reports,
        [
          { key: "equity", label: "权益", color: "#0f766e" },
          { key: "cash", label: "现金", color: "#285fbb" }
        ],
        "timestamp"
      );
      const positionTable = table(
        ["标的", "数量", "成本"],
        positions,
        (row) => [row.symbol, row.quantity, fmt(row.avg_price)]
      );
      const fillsTable = table(
        ["时间", "标的", "方向", "数量", "价格", "费用", "原因", "已实现盈亏"],
        fills,
        (row) => [row.timestamp, row.symbol, row.side, row.quantity, fmt(row.price), fmt(row.fee), row.reason, fmt(row.realized_pnl)]
      );
      const ledger = table(
        ["时间", "标的", "方向", "成交额", "手续费", "现金变化", "累计现金影响", "已实现盈亏"],
        cashLedger,
        (row) => [row.timestamp, row.symbol, row.side, fmt(row.gross_amount), fmt(row.fee), fmt(row.cash_effect), fmt(row.cumulative_cash_effect), fmt(row.realized_pnl)]
      );
      const reportTable = table(
        ["时间", "现金", "权益", "已处理K线", "新增K线", "新增成交"],
        reports,
        (row) => [row.timestamp, fmt(row.cash), fmt(row.equity), row.processed_bars, row.new_bars, row.new_fills]
      );
      $("resultDetail").innerHTML = `${cards}<h4>实时资金曲线</h4>${chart}<div class="notice">状态文件：${escapeHtml(result.state_path || "-")}</div><h4>当前持仓</h4>${positionTable}<h4>全部成交记录</h4>${fillsTable}<h4>全部资金流水</h4>${ledger}<h4>轮询资金记录</h4>${reportTable}`;
    }

    function lineChart(rows, series, labelKey) {
      if (!rows.length) {
        return "<div class=\"chart\"><div class=\"chart-empty\">暂无资金曲线数据。</div></div>";
      }
      const values = [];
      for (const row of rows) {
        for (const item of series) {
          const value = Number(row[item.key]);
          if (Number.isFinite(value)) values.push(value);
        }
      }
      if (!values.length) {
        return "<div class=\"chart\"><div class=\"chart-empty\">暂无可绘制数值。</div></div>";
      }
      const width = 720;
      const height = 220;
      const pad = { left: 54, right: 18, top: 18, bottom: 32 };
      const min = Math.min(...values);
      const max = Math.max(...values);
      const span = max === min ? 1 : max - min;
      const xFor = (index) => {
        if (rows.length === 1) return pad.left + (width - pad.left - pad.right) / 2;
        return pad.left + (index / (rows.length - 1)) * (width - pad.left - pad.right);
      };
      const yFor = (value) => height - pad.bottom - ((value - min) / span) * (height - pad.top - pad.bottom);
      const polylines = series.map((item) => {
        const points = rows.map((row, index) => {
          const value = Number(row[item.key]);
          return Number.isFinite(value) ? `${xFor(index).toFixed(2)},${yFor(value).toFixed(2)}` : "";
        }).filter(Boolean).join(" ");
        return `<polyline points="${points}" fill="none" stroke="${item.color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></polyline>`;
      }).join("");
      const firstLabel = rows[0] ? rows[0][labelKey] : "";
      const lastLabel = rows[rows.length - 1] ? rows[rows.length - 1][labelKey] : "";
      const legend = `<div class="legend">${series.map((item) => `<span><i class="swatch${item.key === "cash" ? " blue" : ""}"></i>${escapeHtml(item.label)}</span>`).join("")}</div>`;
      return `
        <div class="chart">
          <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="资金曲线">
            <line x1="${pad.left}" y1="${height - pad.bottom}" x2="${width - pad.right}" y2="${height - pad.bottom}" stroke="#d7dee6"></line>
            <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${height - pad.bottom}" stroke="#d7dee6"></line>
            <text x="8" y="${pad.top + 4}" fill="#667487" font-size="11">${escapeHtml(fmt(max))}</text>
            <text x="8" y="${height - pad.bottom}" fill="#667487" font-size="11">${escapeHtml(fmt(min))}</text>
            <text x="${pad.left}" y="${height - 10}" fill="#667487" font-size="11">${escapeHtml(String(firstLabel).slice(0, 10))}</text>
            <text x="${width - pad.right - 90}" y="${height - 10}" fill="#667487" font-size="11">${escapeHtml(String(lastLabel).slice(0, 10))}</text>
            ${polylines}
          </svg>
        </div>
        ${legend}
      `;
    }

    function renderLegacyEquityTail(result) {
      return table(
        ["时间", "收盘", "现金", "持仓", "权益"],
        (result.equity_tail || []).slice(-10).reverse(),
        (row) => [row.timestamp, fmt(row.close), fmt(row.cash), row.position_qty, fmt(row.equity)]
      );
    }

    function renderDownloadDetail(result) {
      $("resultDetail").innerHTML = resultCards([
        ["数据源", result.provider || "-"],
        ["标的", result.symbol || "-"],
        ["行数", result.rows ?? 0],
        ["开始", result.start || "-"],
        ["结束", result.end || "-"],
        ["输出", result.output || "-"]
      ]);
    }

    function renderScreenDetail(result) {
      const candidates = result.candidates || [];
      const cards = resultCards([
        ["入选数量", candidates.length],
        ["候选总数", result.total_candidates ?? candidates.length],
        ["扫描文件", (result.files || []).length],
        ["回看", result.parameters ? result.parameters.lookback : "-"],
        ["最低收益", result.parameters ? result.parameters.min_return_pct : "-"],
        ["趋势过滤", result.parameters && result.parameters.require_uptrend ? "开启" : "关闭"]
      ]);
      const rows = table(
        ["排名", "标的", "日期", "收盘", "回看收益", "短均线", "长均线", "均量", "分数"],
        candidates,
        (row, index) => [index + 1, row.symbol, row.last_date, fmt(row.close), `${fmt(row.return_pct)}%`, fmt(row.short_ma), fmt(row.long_ma), fmt(row.avg_volume), fmt(row.score)]
      );
      const errors = result.errors && result.errors.length
        ? `<div class="notice">有 ${result.errors.length} 个文件未能读取，详见原始 JSON。</div>`
        : "";
      $("resultDetail").innerHTML = `${cards}<h4>选股结果</h4>${rows}${errors}`;
    }

    function resultCards(items) {
      return `<div class="result-grid">${items.map(([label, value]) => `<div class="result-card"><b>${escapeHtml(label)}</b><span>${escapeHtml(String(value ?? "-"))}</span></div>`).join("")}</div>`;
    }

    function table(headers, rows, mapRow) {
      if (!rows.length) return "<div class=\"notice\">暂无数据。</div>";
      const head = headers.map((item) => `<th>${escapeHtml(item)}</th>`).join("");
      const body = rows.map((row, index) => `<tr>${mapRow(row, index).map((item) => `<td>${escapeHtml(String(item ?? ""))}</td>`).join("")}</tr>`).join("");
      return `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
    }

    function fmt(value) {
      if (value === undefined || value === null || value === "") return "-";
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return String(value);
      return numeric.toLocaleString("zh-CN", { maximumFractionDigits: 4 });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    function parseJsonEditor() {
      try {
        const parsed = JSON.parse($("jsonOutput").value);
        $("jsonState").textContent = "已同步";
        writeForm(parsed);
      } catch (error) {
        $("jsonState").textContent = "JSON 错误";
      }
    }

    async function boot() {
      try {
        await refreshConfigs();
        await refreshJobs();
        setStatus("后台已连接", "ok");
      } catch (error) {
        writeForm(defaultConfig);
        setStatus(error.message || "后台连接失败", "error");
      }
    }

    $("historyModeBtn").addEventListener("click", () => setMode("history"));
    $("liveModeBtn").addEventListener("click", () => setMode("live"));
    $("reloadBtn").addEventListener("click", async () => {
      await refreshConfigs();
      await refreshJobs();
      setStatus("已刷新", "ok");
    });
    $("saveBtn").addEventListener("click", () => saveConfig().catch((error) => setStatus(error.message, "error")));
    $("downloadBtn").addEventListener("click", () => runDownload().catch((error) => setStatus(error.message, "error")));
    $("backtestBtn").addEventListener("click", () => runBacktest().catch((error) => setStatus(error.message, "error")));
    $("screenBtn").addEventListener("click", () => runScreen().catch((error) => setStatus(error.message, "error")));
    $("liveStartBtn").addEventListener("click", () => startLive().catch((error) => setStatus(error.message, "error")));
    $("liveStopBtn").addEventListener("click", () => stopLive().catch((error) => setStatus(error.message, "error")));
    $("refreshJobsBtn").addEventListener("click", () => refreshJobs().catch((error) => setStatus(error.message, "error")));
    $("jsonOutput").addEventListener("change", parseJsonEditor);
    $("downloadOut").addEventListener("input", () => { $("downloadOut").dataset.touched = "1"; });
    $("statePath").addEventListener("input", () => { $("statePath").dataset.touched = "1"; });
    $("adjust").addEventListener("change", () => {
      $("downloadOut").dataset.touched = "";
      updateDerivedPaths();
    });
    for (const field of fields) {
      field.addEventListener("input", syncJson);
      field.addEventListener("change", syncJson);
    }
    $("strategyName").addEventListener("change", () => {
      updateStrategyFields();
      const defaults = {
        moving_average_cross: { name: "moving_average_cross", target_weight: 0.6, short_window: 5, long_window: 20 },
        breakout: { name: "breakout", target_weight: 0.55, entry_window: 20, exit_window: 10 },
        rsi_mean_reversion: { name: "rsi_mean_reversion", target_weight: 0.35, rsi_window: 14, buy_below: 32, sell_above: 58 },
        momentum: { name: "momentum", target_weight: 0.5, lookback_window: 20, entry_return_pct: 0.06, exit_return_pct: -0.03 }
      };
      const current = readForm();
      current.strategy = defaults[$("strategyName").value];
      writeForm(current);
    });

    setInterval(() => {
      refreshJobs().catch(() => undefined);
    }, 2500);

    boot();
  </script>
</body>
</html>
